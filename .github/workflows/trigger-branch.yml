name: "Trigger Branch"

on:
  push:
    branches:
      - "**"

jobs:
  trigger:
    permissions:
      contents: read
      statuses: write
    name: Trigger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: repotea-workspace/kangumi/github-actions/dyn-actions@main
        name: dyn-actions
        with:
          metadata-format: source-yml
          status_token: ${{ github.token }}
          owner: repotea-workflow
          ssh_key: ${{ secrets.GH_SSH_PRIVATE_KEY_0XFE10 }}
